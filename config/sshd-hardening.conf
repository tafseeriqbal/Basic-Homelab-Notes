# /etc/ssh/sshd_config.d/99-hardening.conf
#
# Key-only auth. Password auth disabled means credential stuffing and
# brute force are off the table entirely — fail2ban sits on top of this
# as defence in depth rather than as the primary control.
#
# Test with a second session open before restarting sshd. Locking
# yourself out of a headless box means physically attaching a keyboard.

PasswordAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
